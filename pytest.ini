[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests with mocked external APIs (fast, offline)
    integration: Integration tests that exercise the FastAPI app end-to-end (offline, mocked LLM)
    slow: Tests that take more than a couple of seconds
timeout = 30
# Logs are captured per-test and only printed when a test fails.
# To stream logs live during a debugging session, run with:
#   pytest -o log_cli=true -o log_cli_level=INFO
log_cli = false
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
