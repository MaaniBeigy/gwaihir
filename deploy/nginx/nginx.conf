events {}

http {
    map $ssl_client_s_dn_cn $cn_ok {
        default 0;
        "gamebus-api-v2" 1;
    }

    limit_req_zone $ssl_client_s_dn_cn zone=coach_chat:10m rate=30r/m;
    limit_req_zone $ssl_client_s_dn_cn zone=coach_misc:10m rate=120r/m;

    server {
        listen 443 ssl http2;
        server_name coach.example.com;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_verify_client on;
        ssl_client_certificate /etc/nginx/certs/client-ca.pem;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        allow 203.0.113.42;
        deny all;

        location = /chat {
            if ($cn_ok = 0) { return 403; }
            limit_req zone=coach_chat burst=10 nodelay;
            proxy_pass http://coach-api:8003;
            proxy_set_header X-Client-CN $ssl_client_s_dn_cn;
            proxy_set_header X-Coach-Request-Id $http_x_coach_request_id;
            proxy_read_timeout 600s;
        }

        location / {
            if ($cn_ok = 0) { return 403; }
            limit_req zone=coach_misc burst=20 nodelay;
            proxy_pass http://coach-api:8003;
            proxy_set_header X-Client-CN $ssl_client_s_dn_cn;
            proxy_set_header X-Coach-Request-Id $http_x_coach_request_id;
        }
    }
}
